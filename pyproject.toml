[project]
name = "2D-Diaries"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "gunicorn>=27.0.1",
    "postgrest>=2.34.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "supabase>=2.34.1",
    "supabase-auth>=2.34.1",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]


[tool.pytest.ini_options]
pythonpath = ["./"]

